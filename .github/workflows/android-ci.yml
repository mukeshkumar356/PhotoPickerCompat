name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests (photopicker-compat)
        run: ./gradlew :photopicker-compat:testDebugUnitTest --console=plain

      - name: Assemble library (release AAR)
        run: ./gradlew :photopicker-compat:assembleRelease --console=plain

      - name: Assemble sample app (debug APK)
        run: ./gradlew :sample:assembleDebug --console=plain
